services:
  app:
    build: .
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env.production
    environment:
      DATABASE_PATH: /data/natal-solidario.sqlite
      NODE_ENV: production
      PORT: 3001
      PRIVATE_IMPORT_FILE: /run/private-data/children.json
      PRIVATE_PDF_PATH: /data/lista-criancas.pdf
    volumes:
      - ./data:/data
      - ./private-data:/run/private-data:ro
    expose:
      - "3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Defina SITE_DOMAIN em .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: